schema_version: "2.0"
deployment_contract:
  environment_id: PortEnergyDispatchEnv-v3
  observations:
    energy_and_market:
      - grid_carbon_kg_per_kwh
      - electricity_price_per_kwh
      - fuel_price_per_liter
      - renewable_power_available_kw
      - grid_available_ratio
    vessel_and_berth:
      - loaded_import_teu
      - loaded_export_teu
      - total_teu
      - vessels_at_anchor
      - vessels_at_berth
      - vessels_departed
      - average_days_at_berth
      - average_days_in_port
      - berth_available_ratio
    weather_and_navigation:
      - wind_speed_m_s
      - wave_height_m
      - visibility_km
      - precipitation_mm
    equipment_and_shore_power:
      - crane_available_ratio
      - yard_available_ratio
      - shore_power_compatible_ratio
  actions:
    continuous:
      - shore_power_ratio
      - crane_ratio
      - yard_ratio
      - battery_power_ratio
    dqn_discretization: "3×3×3×3 = 81 auditable combinations"
  objective_terms:
    - carbon
    - shore_power
    - cost
    - delay
    - safety
    - peak
    - storage
    - throughput
  hard_constraints:
    - grid_import_capacity
    - crane_and_yard_availability
    - berth_availability
    - shore_power_compatibility
    - battery_soc_and_terminal_soc
    - delay_limit
  required_adapters:
    - terminal_operating_system
    - energy_management_system
    - berth_and_vessel_feed
    - equipment_availability_feed
    - weather_and_navigation_feed
    - shore_power_compatibility_registry
    - identity_and_audit

regulatory_resilience_contract:
  environment_id: PortEnergyDispatchEnv-v4
  evidence_label: PREDECLARED_REGULATORY_ENERGY_STRESS_SCENARIO_NOT_FIELD_KPI
  extends: PortEnergyDispatchEnv-v3
  observations:
    exogenous_authority_signals:
      - maritime_inspection_ratio
      - customs_inspection_ratio
      - maritime_release_ratio
      - customs_release_ratio
      - expected_hold_hours
    terminal_readiness_signals:
      - document_readiness_ratio
      - inspection_resource_available_ratio
      - regulatory_scenario_observed
    stateful_queues:
      - maritime_hold_queue_teu
      - customs_hold_queue_teu
      - released_recovery_queue_teu
  additional_actions:
    - inspection_readiness_ratio
    - recovery_priority_ratio
  authority_boundary:
    - inspection_selection_is_exogenous
    - detention_is_exogenous
    - official_release_is_exogenous
    - policy_controls_terminal_readiness_and_recovery_only
  action_contract:
    continuous: 6
    dqn_discretization: "3×3×3×3×3×3 = 729 auditable combinations"
  production_authority: false

operational_flex_contract:
  environment_id: PortEnergyDispatchEnv-v5
  evidence_label: PUBLIC_ANCHOR_OPERATIONAL_FLEX_SCENARIO_NOT_FIELD_TELEMETRY
  extends: PortEnergyDispatchEnv-v4
  observation_count: 73
  observations:
    flexible_operations:
      - agv_fleet_available_ratio
      - agv_mean_soc
      - agv_charge_demand_kwh
      - agv_departure_requirement_kwh
      - charger_available_ratio
      - reefer_connected_count
      - reefer_critical_count
      - reefer_power_demand_kw
      - reefer_temperature_margin_c
      - building_flexible_load_kw
      - building_critical_load_kw
      - building_comfort_margin_c
      - demand_response_event_active
      - demand_response_target_kw
      - demand_response_price_per_kwh
      - crane_health_ratio
      - yard_health_ratio
      - shore_power_health_ratio
      - maintenance_active_ratio
      - berth_reservation_pressure_ratio
  actions:
    continuous:
      - shore_power_ratio
      - crane_ratio
      - yard_ratio
      - battery_power_ratio
      - inspection_readiness_ratio
      - recovery_priority_ratio
      - agv_charge_ratio
      - reefer_service_ratio
      - building_flex_ratio
      - demand_response_ratio
    dqn_curated_templates: 243
  hard_constraints:
    - grid_import_capacity
    - battery_soc_and_terminal_reachability
    - agv_departure_energy_obligation
    - reefer_thermal_safety
    - building_critical_load
    - equipment_health_and_maintenance_capacity
  authority_boundary:
    - rl_controls_resource_envelopes_only
    - regulatory_selection_and_release_are_exogenous
    - physical_interlocks_remain_site_owned
    - human_approval_and_rollback_are_mandatory
  production_authority: false

hybrid_rl_contract:
  environment_id: PortEnergyHybridResidualEnv-v6
  evidence_label: PUBLIC_ANCHOR_HYBRID_RL_SCENARIO_NOT_FIELD_TELEMETRY
  extends: PortEnergyDispatchEnv-v5
  observation_count: 106
  action_count: 16
  observations:
    inherited_v5: 73
    hybrid_operations: 16
    hybrid_state_and_previous_priorities: 7
    feasible_controller_reference: 10
  actions:
    bounded_controller_residuals: 10
    rl_guided_solver_priorities:
      - jit_arrival_priority
      - green_berth_priority
      - crane_task_priority
      - yard_slotting_priority
      - truck_gate_priority
      - maintenance_priority
    discrete_actions_supported: false
  reward_terms: 17
  decision_split:
    rl_or_hybrid_strategy_domains: 16
    pure_control_or_physics_domains: 1
    deterministic_governance_authority_or_safety_domains: 10
  hard_constraints:
    - grid_import_capacity
    - battery_soc_and_terminal_reachability
    - agv_departure_energy_obligation
    - reefer_thermal_safety
    - building_critical_load
    - vessel_berth_compatibility
    - crane_task_precedence
    - yard_slot_capacity
    - truck_gate_capacity
    - statutory_maintenance_due_date
    - authority_release_exogenous
    - physical_dispatch_disabled
  production_authority: false

ports:
  - id: port_la_public_benchmark
    name: Port of Los Angeles 2020-2025 energy-carbon benchmark
    mode: offline_public_benchmark
    timezone: America/Los_Angeles
    currency: CNY
    dataset_id: port_la_2020_2025_hourly
    environment_id: PortEnergyDispatchEnv-v1
    production_dispatch_authorized: false
    adapters: {}
    regulatory_profile:
      - IMO 2023 GHG Strategy context
      - Local terminal rules require operator calibration
    regulatory_sources:
      - https://www.imo.org/en/mediacentre/hottopics/pages/cutting-ghg-emissions.aspx
    note: Longitudinal energy-carbon evidence with monthly official throughput anchors.

  - id: port_la_vessel_activity_benchmark
    name: Port of Los Angeles 2020-2024 vessel-activity enhanced benchmark
    mode: offline_public_benchmark
    timezone: America/Los_Angeles
    currency: CNY
    dataset_id: port_la_2020_2024_vessel_activity_hourly
    environment_id: PortEnergyDispatchEnv-v2
    production_dispatch_authorized: false
    adapters: {}
    regulatory_profile:
      - IMO 2023 GHG Strategy context
      - Local terminal rules require operator calibration
    regulatory_sources:
      - https://www.imo.org/en/mediacentre/hottopics/pages/cutting-ghg-emissions.aspx
    note: Adds official daily anchor, berth, departure and dwell observations.

  - id: port_la_regulatory_resilience_benchmark
    name: Port of Los Angeles 2024 maritime/customs inspection energy-carbon resilience scenario
    mode: offline_public_benchmark
    timezone: America/Los_Angeles
    currency: CNY
    dataset_id: port_la_2024_regulatory_resilience_hourly
    environment_id: PortEnergyDispatchEnv-v4
    production_dispatch_authorized: false
    adapters: {}
    regulatory_profile:
      - IMO Port State Control inspection and detention boundary
      - U.S. CBP cargo hold and official release boundary
      - Inspection and release inputs are frozen stress variables, not authority records
    regulatory_sources:
      - https://www.imo.org/en/ourwork/iiis/pages/port%20state%20control.aspx
      - https://www.help.cbp.gov/s/article/Article-1268?language=en_US
      - https://www.help.cbp.gov/s/article/Article-1267
    authority_boundary:
      inspection_and_release: exogenous
      terminal_readiness_and_recovery: policy_controllable
      production_authority: false
    note: Propagates authority holds into terminal delay, auxiliary energy, peak load, cost and carbon without claiming field telemetry.

  - id: port_la_operational_flex_benchmark
    name: Port of Los Angeles 2020-2024 public-anchor operational-flex benchmark
    mode: offline_public_benchmark
    timezone: America/Los_Angeles
    currency: CNY
    dataset_id: port_la_2020_2024_operational_flex_hourly
    environment_id: PortEnergyDispatchEnv-v5
    production_dispatch_authorized: false
    adapters: {}
    regulatory_profile:
      - Public vessel, throughput and grid anchors with deterministic engineering supplements
      - Automated guided vehicle, reefer, building, demand-response and equipment-health fields require site replacement
      - Regulatory selection and release remain exogenous authority inputs
    regulatory_sources:
      - https://www.portoflosangeles.org/business/statistics/vessel-activity
      - https://www.portoflosangeles.org/business/statistics/container-statistics
      - https://www.eia.gov/electricity/data/eia861m/
    authority_boundary:
      resource_envelopes: policy_controllable
      authority_decisions_and_physical_interlocks: exogenous
      production_authority: false
    note: Registered v5 training scenario; 73 observations and 10 actions are executable offline, while modeled supplements are explicitly not field telemetry.

  - id: port_la_hybrid_rl_benchmark
    name: Port of Los Angeles 2020-2024 public-anchor hybrid residual-RL benchmark
    mode: offline_public_benchmark
    timezone: America/Los_Angeles
    currency: CNY
    dataset_id: port_la_2020_2024_hybrid_rl_hourly
    environment_id: PortEnergyHybridResidualEnv-v6
    production_dispatch_authorized: false
    adapters: {}
    regulatory_profile:
      - Public vessel, throughput and grid anchors with deterministic hybrid-operation supplements
      - RL emits bounded controller residuals and solver priorities, never named executable orders
      - Named schedules, safety projections, authority decisions and physical interlocks remain external
    regulatory_sources:
      - https://www.portoflosangeles.org/business/statistics/vessel-activity
      - https://www.portoflosangeles.org/business/statistics/container-statistics
      - https://www.eia.gov/electricity/data/eia861m/
    authority_boundary:
      strategy_weights_and_bounded_residuals: policy_controllable
      named_schedule_and_fast_control: deterministic_solver_or_controller
      authority_decisions_and_physical_interlocks: exogenous
      production_authority: false
    note: Registered v6 scenario; 106 observations and 16 continuous hybrid outputs are executable offline, while all new operational fields remain replaceable modeled supplements.

  - id: port_la_live_template
    name: Port of Los Angeles production connector template
    mode: live_port_template
    timezone: America/Los_Angeles
    currency: USD
    dataset_id:
    environment_id: PortEnergyDispatchEnv-v3
    production_dispatch_authorized: false
    adapters:
      terminal_operating_system: false
      energy_management_system: false
      berth_and_vessel_feed: false
      equipment_availability_feed: false
      weather_and_navigation_feed: false
      shore_power_compatibility_registry: false
      identity_and_audit: false
    regulatory_profile:
      - IMO 2023 GHG Strategy context
      - U.S. and California port rules require local compliance mapping
    regulatory_sources:
      - https://www.imo.org/en/mediacentre/hottopics/pages/cutting-ghg-emissions.aspx
    note: Connect terminal-approved feeds and complete dry-run acceptance before authorization.

  - id: port_rotterdam_live_template
    name: Port of Rotterdam production connector template
    mode: live_port_template
    timezone: Europe/Amsterdam
    currency: EUR
    dataset_id:
    environment_id: PortEnergyDispatchEnv-v3
    production_dispatch_authorized: false
    adapters:
      terminal_operating_system: false
      energy_management_system: false
      berth_and_vessel_feed: false
      equipment_availability_feed: false
      weather_and_navigation_feed: false
      shore_power_compatibility_registry: false
      identity_and_audit: false
    regulatory_profile:
      - IMO 2023 GHG Strategy
      - EU AFIR shore-side electricity requirements
      - EU ETS and FuelEU Maritime require local compliance mapping
    regulatory_sources:
      - https://www.imo.org/en/mediacentre/hottopics/pages/cutting-ghg-emissions.aspx
      - https://eur-lex.europa.eu/eli/reg/2023/1804/2026-01-08/eng
    note: Regulation labels are integration requirements, not automated legal assurance.

  - id: port_singapore_live_template
    name: Port of Singapore production connector template
    mode: live_port_template
    timezone: Asia/Singapore
    currency: SGD
    dataset_id:
    environment_id: PortEnergyDispatchEnv-v3
    production_dispatch_authorized: false
    adapters:
      terminal_operating_system: false
      energy_management_system: false
      berth_and_vessel_feed: false
      equipment_availability_feed: false
      weather_and_navigation_feed: false
      shore_power_compatibility_registry: false
      identity_and_audit: false
    regulatory_profile:
      - IMO 2023 GHG Strategy
      - MPA and terminal requirements require local compliance mapping
    regulatory_sources:
      - https://www.imo.org/en/mediacentre/hottopics/pages/cutting-ghg-emissions.aspx
    note: Tropical weather, transshipment workload and terminal constraints must come from approved feeds.
