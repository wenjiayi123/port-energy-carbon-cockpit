services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8808:8808"
    environment:
      APP_ENV: production
      API_AUTH_MODE: ${API_AUTH_MODE:-api_key}
      VIEWER_API_KEY: ${VIEWER_API_KEY:-}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_PUBLIC_KEYS_JSON: ${OIDC_PUBLIC_KEYS_JSON:-}
      OIDC_ROLE_MAP_JSON: ${OIDC_ROLE_MAP_JSON:-}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-roles}
      OIDC_TENANT_CLAIM: ${OIDC_TENANT_CLAIM:-tenant_ids}
      OIDC_REQUIRE_MFA: ${OIDC_REQUIRE_MFA:-true}
      PORT_SNAPSHOT_KEYS_JSON: ${PORT_SNAPSHOT_KEYS_JSON:-}
      MV_VERIFIER_PUBLIC_KEYS_JSON: ${MV_VERIFIER_PUBLIC_KEYS_JSON:-}
      CARBON_REGISTRY_PUBLIC_KEYS_JSON: ${CARBON_REGISTRY_PUBLIC_KEYS_JSON:-}
      MANAGEMENT_SYSTEM_AUDITOR_PUBLIC_KEYS_JSON: ${MANAGEMENT_SYSTEM_AUDITOR_PUBLIC_KEYS_JSON:-}
      OPERATIONS_SOURCE_PUBLIC_KEYS_JSON: ${OPERATIONS_SOURCE_PUBLIC_KEYS_JSON:-}
      ELECTRICAL_SOURCE_PUBLIC_KEYS_JSON: ${ELECTRICAL_SOURCE_PUBLIC_KEYS_JSON:-}
      ALGORITHM_EVIDENCE_PUBLIC_KEYS_JSON: ${ALGORITHM_EVIDENCE_PUBLIC_KEYS_JSON:-}
      COMMERCIAL_SETTLEMENT_PUBLIC_KEYS_JSON: ${COMMERCIAL_SETTLEMENT_PUBLIC_KEYS_JSON:-}
      PORT_COLLABORATION_PUBLIC_KEYS_JSON: ${PORT_COLLABORATION_PUBLIC_KEYS_JSON:-}
      ENTERPRISE_SECURITY_PUBLIC_KEYS_JSON: ${ENTERPRISE_SECURITY_PUBLIC_KEYS_JSON:-}
      SITE_CUTOVER_TRUSTED_SIGNERS_JSON: ${SITE_CUTOVER_TRUSTED_SIGNERS_JSON:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173}
    volumes:
      - rl-runs:/app/app/data/runs
      - audit-logs:/app/app/data/audit
      - runtime-state:/app/app/data/runtime
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8808/api/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    environment:
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=64m,uid=101,gid=101
      - /var/run:size=8m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rl-runs:
  audit-logs:
  runtime-state:
