name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the exact API route, UI panel, or command.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps, logs with secrets removed, and environment versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Data and model evidence
      description: Include dataset/model hashes when relevant; do not attach private port data.
