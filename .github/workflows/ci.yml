name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and audit tooling
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -e "backend[dev,rl,data]" pip-audit
      - name: Lint backend
        run: python -m ruff check --isolated --select E4,E7,E9,F backend/app
      - name: Test backend and RL smoke runs
        run: cd backend && python -m pytest app/tests -q
      - name: Validate default dataset
        run: PYTHONPATH=backend python -m app.rl.cli validate-data port_la_2020_2025_monthly
      - name: Verify published offline benchmark evidence
        run: |
          PYTHONPATH=backend python -m app.rl.benchmark verify reports/offline_benchmark_v3.json
          PYTHONPATH=backend python -m app.rl.benchmark verify reports/offline_benchmark_vessel_activity_v1.json
          PYTHONPATH=backend python -m app.rl.landing_benchmark verify reports/port_landing_benchmark_v4.json
          python scripts/export_runtime_evidence.py verify
      - name: Audit Python dependencies
        run: python -m pip_audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - name: Install frontend
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        run: cd frontend && pnpm audit --audit-level high
      - name: Build frontend
        run: cd frontend && pnpm build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build backend image
        run: docker build --tag energy-carbon-backend:ci backend
      - name: Build frontend image
        run: docker build --tag energy-carbon-frontend:ci frontend
