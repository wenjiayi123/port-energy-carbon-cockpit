name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and audit tooling
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -e "backend[dev]" pip-audit
      - name: Lint backend
        run: python -m ruff check backend/app
      - name: Test backend and RL smoke runs
        run: cd backend && python -m pytest app/tests -q
      - name: Validate default dataset
        run: PYTHONPATH=backend python -m app.rl.cli validate-data port_la_2025_monthly
      - name: Audit Python dependencies
        run: python -m pip_audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - name: Install frontend
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        run: cd frontend && pnpm audit --audit-level high
      - name: Build frontend
        run: cd frontend && pnpm build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image
        run: docker build --tag energy-carbon-backend:ci backend
      - name: Build frontend image
        run: docker build --tag energy-carbon-frontend:ci frontend
