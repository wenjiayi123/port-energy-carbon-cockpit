[project]
name = "energy-carbon-dispatch-backend"
version = "0.3.0"
description = "Auditable offline energy-carbon dispatch and reinforcement-learning benchmark API."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  # The offline benchmark is an evidence artifact. Pin its numerical stack so
  # six-decimal aggregate checks do not drift across developer and CI hosts.
  "pandas==3.0.3",
  "numpy==1.26.4",
  "certifi>=2024.8.30",
  "openpyxl>=3.1.5,<4",
  "pyyaml>=6.0.0",
  "gymnasium==1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx2==2.9.1",
  "ruff>=0.6.0",
  "pip-audit>=2.9,<3",
]
data = [
  "pdfplumber==0.11.9",
  "cryptography==50.0.0",
]
rl = [
  # PyTorch stopped publishing patched Intel-macOS wheels after 2.2.2. Keep
  # neural training off that unsupported host; causal MPC and replay remain
  # available, while Linux/Apple Silicon use the audited learner runtime.
  "stable-baselines3==2.4.1; platform_system != 'Darwin' or platform_machine != 'x86_64'",
  "torch>=2.13,<3; platform_system != 'Darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
energy-carbon-rl = "app.rl.cli:main"

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
