[project]
name = "energy-carbon-dispatch-backend"
version = "0.2.0"
description = "Auditable offline energy-carbon dispatch and reinforcement-learning benchmark API."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pandas>=2.2.0",
  "numpy>=1.26,<3",
  "pyyaml>=6.0.0",
  "gymnasium>=1.0,<2",
  "stable-baselines3>=2.4,<3",
  "torch>=2.13,<3; platform_system != 'Darwin' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "pip-audit>=2.9,<3",
]

[project.scripts]
energy-carbon-rl = "app.rl.cli:main"

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
