<!doctype html>

    position: absolute;
    inset: 28px;

    border-radius: 24px;

  .eyebrow {
    position: relative;
    color: #59ead8;

  }

    position: relative;
    margin: 0;
    color: #f4c267;
    font-size: 31px;
    font-weight: 760;
    letter-spacing: 3px;
  }
  p {
    position: relative;
    max-width: 760px;
    margin: 24px 0 23px;
    color: #b6ccd8;
    font-size: 21px;
    line-height: 1.42;
  }
  .stack { position: relative; display: flex; align-items: center; gap: 10px; }
  .stack span {
    padding: 8px 13px;
    border: 1px solid rgba(89, 234, 216, 0.45);
    border-radius: 999px;
    background: rgba(8, 47, 62, 0.66);
    color: #cafff8;
    font-size: 15px;
    font-weight: 800;
  }
  .stack b { margin-left: 12px; color: #d9e8ef; font-size: 15px; letter-spacing: 1px; }
  footer {
    position: absolute;
    right: 76px;
    bottom: 52px;
    left: 76px;
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.13);
